<?xml version="1.0" encoding="UTF-8"?>
<!-- Live Transit Detroit app icon — Academy-original bus-front pictogram.
     Drawn in-house per SDS-1/SDS-3: ink #000000 on paper #ffffff, ramp grays
     only from anti-aliasing. No third-party art, no Apple assets. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="56" y="56" width="912" height="912" rx="180" fill="#000000"/>
  <!-- mirror stalks -->
  <g stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <line x1="272" y1="330" x2="196" y2="286"/>
    <line x1="752" y1="330" x2="828" y2="286"/>
  </g>
  <!-- bus body (paper silhouette) -->
  <rect x="272" y="216" width="480" height="560" rx="56" fill="#ffffff"/>
  <!-- destination sign -->
  <rect x="392" y="248" width="240" height="34" rx="17" fill="#000000"/>
  <!-- windshield, split -->
  <rect x="312" y="306" width="184" height="138" rx="20" fill="#000000"/>
  <rect x="528" y="306" width="184" height="138" rx="20" fill="#000000"/>
  <!-- headlights -->
  <circle cx="356" cy="540" r="34" fill="#000000"/>
  <circle cx="668" cy="540" r="34" fill="#000000"/>
  <!-- grille -->
  <g stroke="#000000" stroke-width="20" stroke-linecap="round">
    <line x1="424" y1="516" x2="600" y2="516"/>
    <line x1="424" y1="560" x2="600" y2="560"/>
    <line x1="424" y1="604" x2="600" y2="604"/>
  </g>
  <!-- bumper -->
  <rect x="328" y="672" width="368" height="26" rx="13" fill="#000000"/>
  <!-- wheels -->
  <circle cx="372" cy="776" r="40" fill="#000000"/>
  <circle cx="652" cy="776" r="40" fill="#000000"/>
  <circle cx="372" cy="776" r="17" fill="#ffffff"/>
  <circle cx="652" cy="776" r="17" fill="#ffffff"/>
</svg>
